<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8f4">
<meta name="description" content="KlusKompas: jouw persoonlijke klusassistent, materiaallijsten en onderbouwde stappenplannen.">
<title>KlusKompas | Slim klussen</title>
<style>
:root{--ink:#1b392b;--muted:#617b6b;--main:#176046;--pale:#eaf3e9;--bg:#f6f8f4;--line:#dfe8df}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
.shell{max-width:960px;margin:auto;padding:0 16px 106px}header{display:flex;justify-content:space-between;align-items:center;padding:19px 0}
.logo{font-size:22px;font-weight:900;letter-spacing:-.5px;display:flex;gap:9px;align-items:center}.mark{display:grid;place-items:center;border-radius:12px;width:38px;height:38px;background:var(--main);color:white;font-size:24px}
.tag{font-size:11px;color:var(--main);background:#e6f0e8;border-radius:20px;padding:7px 11px;font-weight:750}
.hero{background:var(--main);color:white;border-radius:23px;padding:29px 25px 42px}
.hero h1{font-size:clamp(29px,5vw,44px);line-height:1.13;letter-spacing:-1px;max-width:600px;margin:10px 0}.hero p{color:#dcece1;max-width:600px}
.eyebrow{text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:1.3px}
.panel{background:#fff;border:1px solid var(--line);box-shadow:0 8px 25px #163d2510;padding:22px;border-radius:19px;margin:16px 0}
.askcard{position:relative;margin:-25px 12px 26px}.askcard h3{margin-top:0}
h1{font-size:30px;line-height:1.17;letter-spacing:-.7px}h2{font-size:21px;letter-spacing:-.5px;margin:24px 0 10px}h3{font-size:17px;margin:15px 0 8px}p{margin:8px 0 13px}
label{display:block;font-weight:750;font-size:13px;margin-bottom:6px}
textarea,input,select{font:inherit;border:1px solid #d4e1d5;background:#fff;border-radius:11px;padding:12px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:90px;resize:vertical}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #91cbaa;outline-offset:2px}
.btn{background:var(--main);border:1px solid var(--main);color:#fff;border-radius:11px;padding:11px 16px;font-weight:800;display:inline-block;text-align:center}
.btn.alt{background:var(--pale);color:var(--main);border-color:var(--pale)}.btn.outline{background:#fff;color:var(--main)}
.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.spread{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:13px}
.field{margin:14px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#fff;text-align:left;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:17px}
.tile b{display:block;font-size:16px;margin:7px 0}.tile .symbol{font-size:28px}.tile small{color:var(--muted)}
.chip{background:#f1f8f1;border:1px solid var(--line);border-radius:30px;color:var(--main);font-size:12px;padding:7px 10px}
.warn{padding:14px;border-radius:12px;background:#fff7eb;border:1px solid #f2e0c5;color:#85582c;font-size:13px;margin:13px 0}
.info{padding:14px;border-radius:12px;background:#eff7ed;border:1px solid #dfece0;color:#345d40;font-size:13px;margin:13px 0}
.steps .step{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.steps .step:last-child{border:0}.number{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:var(--pale);color:var(--main);display:grid;place-items:center;font-weight:900}
a{color:var(--main)}.source{display:block;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;text-decoration:none}
.reply{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
.entry{border:1px solid var(--line);background:#fff;border-radius:13px;margin:10px 0;padding:12px;display:flex;gap:12px;align-items:center}
.entry .btn:first-child{flex:1;text-align:left}.center{text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:#fffffff1;backdrop-filter:blur(12px);display:flex;justify-content:center;gap:clamp(9px,7vw,85px);padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:#7c9482;min-width:63px;display:grid;place-items:center;gap:2px;font-size:11px;font-weight:750}
nav button .symbol{font-size:23px}nav button.active{color:var(--main)}
footer{font-size:11px;color:#8a9b8f;text-align:center;padding-top:20px}
@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}.columns{grid-template-columns:1fr}.panel{padding:16px}.hero{padding:24px 20px 45px}.askcard{margin:-25px 9px 25px}}
@media print{header,nav,.controls,.askcard{display:none!important}.panel{border:none;box-shadow:none;padding:4px}.shell{padding:0}}
</style>
</head>
<body>
<div class="shell">
<header><div class="logo"><span class="mark">⌂</span>KlusKompas</div><span class="tag" id="api-status">Demo</span></header>
<main id="content"></main>
<footer>Eerste persoonlijke testversie · Adviezen zijn niet onafhankelijk gecertificeerd</footer>
</div>
<nav><button id="nav-home" onclick="go('home')" class="active"><span class="symbol">⌂</span>Home</button><button id="nav-ask" onclick="go('ask')"><span class="symbol">✎</span>Vraag</button><button id="nav-saved" onclick="go('saved')"><span class="symbol">▣</span>Klussen</button><button id="nav-settings" onclick="go('settings')"><span class="symbol">⚙</span>Instellingen</button></nav>
<script>
"use strict";
var root=document.getElementById("content"), page="home", apiKey="", pic=null, question="", latest=null, records=[];
try{records=JSON.parse(localStorage.getItem("kluskompas-projects-v1")||"[]");if(!Array.isArray(records))records=[]}catch(e){records=[]}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function store(){try{localStorage.setItem("kluskompas-projects-v1",JSON.stringify(records))}catch(e){alert("Opslaan is mislukt; controleer browseropslag.")}}
function go(p){page=p;document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("active",b.id==="nav-"+(p==="floor"||p==="result"?"ask":p))});$("api-status").textContent=apiKey?"AI gekoppeld":"Demo";window.scrollTo(0,0);render()}
function render(){if(page==="home")home();if(page==="ask")ask();if(page==="floor")floor();if(page==="result")showPlan();if(page==="saved")saved();if(page==="settings")settings()}
function home(){root.innerHTML='<section class="hero"><span class="eyebrow">Jouw persoonlijke klusassistent</span><h1>Goed klussen begint met goed advies.</h1><p>De juiste vragen, duidelijke aandachtspunten, materiaaladvies en een persoonlijk stappenplan.</p></section>'+
'<section class="panel askcard"><form id="home-form"><h3>Wat wil je aanpakken?</h3><textarea id="home-question" maxlength="2500" required placeholder="Bijvoorbeeld: hoe egaliseer ik mijn zoldervloer in mijn nieuwbouwwoning?"></textarea><div class="row spread" style="margin-top:12px"><span class="small muted">Beschrijf de klus zoals je hem aan een vakman zou uitleggen.</span><button class="btn">Bekijk mijn klus →</button></div></form><div class="row" style="margin-top:13px"><button class="chip" onclick="openFloor()">Zoldervloer egaliseren</button><button class="chip" onclick="openQuestion(\'Ik wil laminaat leggen\')">Laminaat leggen</button><button class="chip" onclick="openQuestion(\'Ik wil een muur schilderen\')">Muur schilderen</button></div></section>'+
'<h2>Waarmee kan ik helpen?</h2><div class="cards"><button class="tile" onclick="openFloor()"><span class="symbol">▤</span><b>Stappenplan</b><small>Een klus stap voor stap voorbereiden.</small></button><button class="tile" onclick="go(\'ask\')"><span class="symbol">▣</span><b>Materialen</b><small>Kiezen op basis van ondergrond en kwaliteit.</small></button><button class="tile" onclick="go(\'saved\')"><span class="symbol">⌑</span><b>Mijn klussen</b><small>Bewaar je persoonlijke plannen lokaal.</small></button></div>'+
'<div class="panel"><span class="tag">Interactieve demo</span><h3>Zoldervloer egaliseren</h3><p class="small muted">Test de app direct zonder AI-sleutel. De voorbeeldklus stelt gerichte vervolgvragen en toont een voorwaardelijk plan.</p><button class="btn" onclick="openFloor()">Start de voorbeeldklus</button></div>';
$("home-form").onsubmit=function(e){e.preventDefault();openQuestion($("home-question").value)}}
function openFloor(){question="Hoe egaliseer ik de zoldervloer in mijn nieuwbouwwoning?";pic=null;go("floor")}
function openQuestion(q){question=String(q||"").trim();if(!question){alert("Beschrijf eerst je klus.");return}if(/zoldervloer|egaliseren|egaline/i.test(question)&&!apiKey){openFloor();return}if(!apiKey){go("ask");alert("Voor vrije AI-vragen heb je een eigen API-sleutel nodig. De zoldervloerdemo werkt direct.");return}askAI()}
function ask(){root.innerHTML='<div class="eyebrow muted">Persoonlijk klusadvies</div><h1>Wat wil je weten?</h1><section class="panel"><form id="ask-form"><div class="field"><label for="q">Jouw klusvraag</label><textarea required maxlength="2500" id="q" placeholder="Bijvoorbeeld: wat is de beste manier om een vloer voor te bereiden?">'+esc(question)+'</textarea></div><div class="field"><label for="picture">Foto (optioneel)</label><input type="file" id="picture" accept="image/*"><span class="small muted" id="pic-status">Een foto wordt uitsluitend bij het versturen naar de AI-aanbieder doorgestuurd.</span></div><button class="btn" type="submit">Stel mijn vraag →</button></form></section><div class="info">'+(apiKey?"AI-sleutel is actief voor dit tabblad. Antwoorden en productadviezen worden niet onafhankelijk geverifieerd.":"Voor vrije vragen is een eigen Gemini API-sleutel nodig. De ingebouwde zoldervloerdemo werkt zonder sleutel.")+'</div><div class="row"><button class="btn alt" onclick="openFloor()">Probeer de zoldervloerdemo</button><button class="btn outline" onclick="go(\'settings\')">AI instellen</button></div>';
$("ask-form").onsubmit=function(e){e.preventDefault();openQuestion($("q").value)};
$("picture").onchange=function(e){var f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/")||f.size>15000000){alert("Kies een afbeelding kleiner dan 15 MB.");return}var reader=new FileReader();reader.onload=function(){var img=new Image();img.onload=function(){var rate=Math.min(1,1280/Math.max(img.width,img.height));var c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*rate));c.height=Math.max(1,Math.round(img.height*rate));c.getContext("2d").drawImage(img,0,0,c.width,c.height);pic=c.toDataURL("image/jpeg",0.8).split(",")[1];$("pic-status").textContent="Foto toegevoegd (alleen voor deze vraag)."};img.src=reader.result};reader.readAsDataURL(f)}}
function floor(){root.innerHTML='<div class="eyebrow muted">Voorbeeldklus</div><h1>Zoldervloer egaliseren</h1><div class="info">Eerst situatie en ondergrond bepalen. Deze demo doet geen fysieke inspectie en keurt geen productsysteem goed.</div><form class="panel" id="floor-form">'+
'<div class="field"><label>1. Welke ondergrond heb je?</label><select id="base"><option value="unknown">Weet ik niet</option><option value="cement">Zandcement</option><option value="concrete">Beton</option><option value="calcium">Anhydriet / calciumsulfaat</option><option value="wood">Hout of platen</option></select></div>'+
'<div class="field"><label>2. Welke vloerafwerking wil je?</label><select id="finish"><option value="unknown">Weet ik nog niet</option><option value="pvc">Verlijmd PVC</option><option value="click">Laminaat / klik-PVC</option><option value="tiles">Tegels</option><option value="carpet">Tapijt</option></select></div>'+
'<div class="columns"><div class="field"><label>3. Hoogteverschil</label><select id="gap"><option value="unknown">Nog niet gemeten</option><option value="a">0 tot 3 mm</option><option value="b">3 tot 10 mm</option><option value="c">10 tot 30 mm</option><option value="d">Meer dan 30 mm</option></select></div><div class="field"><label>4. Vloeroppervlakte (m²)</label><input type="number" min="0" step="0.5" placeholder="Bijvoorbeeld 30" id="area"></div></div>'+
'<div class="columns"><div class="field"><label>5. Vloerverwarming?</label><select id="heat"><option value="unknown">Weet ik niet</option><option value="yes">Ja</option><option value="no">Nee</option></select></div><div class="field"><label>6. Restvocht gemeten?</label><select id="moist"><option value="no">Nee</option><option value="yes">Ja, meetrapport beschikbaar</option></select></div></div><button class="btn" type="submit">Genereer mijn eerste plan →</button></form>';
$("floor-form").onsubmit=function(e){e.preventDefault();latest={type:"floor",question:question,inputs:{base:$("base").value,finish:$("finish").value,gap:$("gap").value,area:Number($("area").value)||0,heat:$("heat").value,moist:$("moist").value}};go("result")}}
function floorAdvice(x){
var bases={unknown:"Nog onbekend",cement:"Zandcement",concrete:"Beton",calcium:"Anhydriet / calciumsulfaat",wood:"Hout of plaatmateriaal"};
var finishes={unknown:"Nog niet gekozen",pvc:"Verlijmd PVC",click:"Laminaat / klik-PVC",tiles:"Tegels",carpet:"Tapijt"};
var checks=[];
if(x.base==="unknown")checks.push("Stel eerst vast wat voor dekvloer aanwezig is; dit bepaalt het geschikte systeem.");
if(x.finish==="unknown")checks.push("Bepaal de geplande vloerafwerking, omdat vlakheidseisen verschillen.");
if(x.gap==="unknown")checks.push("Meet het vloeroppervlak met een lange rei of laser en leg verschillen vast.");
if(x.gap==="d")checks.push("Bij meer dan 30 mm hoogteverschil eerst een passende opbouw onderzoeken, niet zomaar standaard egaline kiezen.");
if(x.base==="wood")checks.push("Hout vergt een speciaal goedgekeurd egalisatiesysteem. Geen standaard egaline zonder geschiktheidsbewijs.");
if(x.base==="calcium")checks.push("Bij calciumsulfaat zijn specifieke eisen aan voorbereiding, primer en restvocht belangrijk.");
if(x.heat==="unknown")checks.push("Controleer of er vloerverwarming aanwezig is.");
if(x.moist==="no")checks.push("Laat bij nieuwbouw het restvocht beoordelen volgens de eisen van het gekozen vloersysteem.");
var steps=[
["Ondergrond onderzoeken","Controleer type dekvloer, scheuren, hechting, vervuiling en eventuele naden en dilataties."],
["Meten en documenteren","Meet vlakheid, hoogteverschillen, vocht en gewenste eindhoogte. Foto alleen is niet genoeg."],
["Compatibele materialen kiezen","Kies primer en egalisatiemiddel als passend systeem volgens actuele technische productbladen."],
["Voorbereiden","Verwijder losse delen en stof. Behandel gebreken en randvoegen volgens fabrikantinstructies."],
["Egaliseren","Volg het exacte productvoorschrift voor mengverhouding, minimale/maximale laagdikte en verwerkingstijd."],
["Controleren en afwerken","Controleer vlakheid en restvocht en respecteer de vrijgavetijden vóór de afwerkvloer."]
];
var out='<span class="tag">Begeleid voorbeeld · geen definitief advies</span><h2>Jouw eerste klusplan</h2><p>Ondergrond: <b>'+bases[x.base]+'</b><br>Afwerking: <b>'+finishes[x.finish]+'</b></p><div class="warn">Begin niet met gieten totdat de ondergrond, het vochtgehalte en een compatibel egalisatiesysteem zijn bevestigd.</div>';
if(checks.length)out+='<h3>Dit moet je nog controleren</h3><ul>'+checks.map(function(c){return "<li>"+esc(c)+"</li>"}).join("")+"</ul>";
out+='<h3>Stappen op hoofdlijnen</h3><div class="steps">'+steps.map(function(s,i){return '<div class="step"><span class="number">'+(i+1)+'</span><div><strong>'+s[0]+'</strong><p class="small muted">'+s[1]+'</p></div></div>'}).join("")+'</div>';
out+='<h3>Voorlopige materiaallijst</h3><p>Primer en egalisatiemortel uit één passend systeem, bouwstofzuiger, rei/laser, mengkuip, mengmachine, maatbeker, geschikte verdeelgereedschappen en PBM. Concrete producten worden pas na controle geselecteerd.</p>';
var mid={a:1.5,b:5.5,c:16}[x.gap];
if(mid&&x.area>0&&x.base!=="wood")out+='<div class="info">Rekenvoorbeeld: bij '+esc(x.area)+' m² en een <b>veronderstelde</b> gemiddelde laagdikte van '+mid+' mm is het theoretische verbruik circa <b>'+Math.round(x.area*mid*1.5)+' kg</b> (fictieve rekenfactor 1,5 kg/m²/mm). Geen bestelling of productadvies: werkelijke laagdikte en verbruik zijn nog niet vastgesteld.</div>';
out+='<h3>Technische bronnen</h3><a class="source" target="_blank" rel="noopener" href="https://nl.uzin.com/producten/productoverzicht">UZIN – product- en systeemdocumentatie ↗</a><a class="source" target="_blank" rel="noopener" href="https://www.ardex.nl/">ARDEX – fabrikant en technische documenten ↗</a><div class="warn">Dit zijn algemene fabrikantlinks, geen geverifieerde productkeuze voor jouw vloer. Deze versie heeft geen automatische actuele regelgevingcontrole.</div>';
return out}
function showPlan(){if(!latest){go("home");return}
var body=latest.type==="floor"?floorAdvice(latest.inputs):'<span class="tag">AI-antwoord · niet gecontroleerd</span><div class="reply">'+esc(latest.answer)+'</div>';
root.innerHTML='<div class="eyebrow muted">Mijn klusadvies</div><h1>'+esc(latest.question)+'</h1><section class="panel">'+body+'</section><div class="row controls"><button class="btn" onclick="keep()">▣ Klus bewaren</button><button class="btn alt" onclick="window.print()">Print</button><button class="btn outline" onclick="go(\'ask\')">Nieuwe vraag</button></div>'}
function keep(){if(!latest)return;records.unshift(Object.assign({},latest,{date:new Date().toLocaleDateString("nl-NL"),id:Date.now()}));store();alert("Klus lokaal opgeslagen.")}
function saved(){root.innerHTML='<div class="eyebrow muted">Persoonlijk</div><h1>Mijn klussen</h1><p class="muted small">Deze klussen staan alleen opgeslagen in de browser op dit apparaat.</p>'+(records.length?records.map(function(p,i){return '<div class="entry"><button class="btn alt" onclick="openSaved('+i+')">'+esc(p.question)+'<br><small>'+esc(p.date)+'</small></button><button class="btn outline" onclick="eraseSaved('+i+')">Wissen</button></div>'}).join(""):'<div class="panel">Nog niets opgeslagen. Maak eerst een klusplan en kies "Klus bewaren".</div>')}
function openSaved(i){latest=records[i];go("result")}
function eraseSaved(i){if(confirm("Deze opgeslagen klus verwijderen?")){records.splice(i,1);store();saved()}}
function settings(){root.innerHTML='<div class="eyebrow muted">Persoonlijke instellingen</div><h1>AI-functies</h1><section class="panel"><h3>Vrije klusvragen via Gemini</h3><p class="small muted">De voorbeeldklus werkt zonder sleutel. Met je eigen gratis-tier API-sleutel kun je andere klusvragen stellen en een foto meesturen.</p><div class="field"><label>Gemini API-sleutel</label><input id="api-key" type="password" autocomplete="off" spellcheck="false" value="'+esc(apiKey)+'" placeholder="Plak je sleutel"></div><div class="row"><button class="btn" onclick="activate()">AI activeren</button><button class="btn outline" onclick="forgetKey()">Sleutel wissen</button></div><p><a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Sleutel aanvragen bij Google AI Studio ↗</a></p><div class="warn">Een browser-app kan je API-sleutel niet volledig beschermen. Alleen voor privégebruik: zet nooit een sleutel in GitHub. Vraagtekst en foto worden aan Google gestuurd; controleer de gebruiksvoorwaarden van de gratis tier.</div></section><section class="panel"><h3>Privacy en beperkingen</h3><p>Je opgeslagen klussen blijven op dit apparaat. Er is nog geen login, synchronisatie, automatische fabrikantcontrole of gegarandeerd veilige uitvoeringsinstructie.</p><button class="btn alt" onclick="eraseAll()">Alle opgeslagen klussen wissen</button></section>'}
function activate(){apiKey=$("api-key").value.trim();if(!apiKey){alert("Vul eerst een API-sleutel in.");return}go("ask")}
function forgetKey(){apiKey="";settings();$("api-status").textContent="Demo"}
function eraseAll(){if(confirm("Alle klussen op dit apparaat verwijderen?")){records=[];store();alert("Klussen gewist.")}}
async function askAI(){
root.innerHTML='<section class="panel"><h2>Je klusvraag wordt geanalyseerd…</h2><p class="small muted">AI-adviezen zijn nog niet onafhankelijk technisch gecontroleerd.</p></section>';
var system="Je bent KlusKompas, een voorzichtige Nederlandstalige klusassistent. Vraag eerst naar ontbrekende cruciale omstandigheden (ondergrond, maten, bouwjaar, staat, afwerking, vocht, veiligheid), voordat je definitieve stappen of producten geeft. Geef een helder onderscheid tussen fabrikantvoorschriften, regels en algemene tips. Verzin nooit bronlinks, wetgeving, normen, productgeschiktheid of prijzen. Geef bij bouwconstructies, elektra, gas, asbest en koudemiddelen uitsluitend veilige algemene controles en verwijs naar deskundigen. Als details voldoende bekend zijn, geef secties: Situatie, Wat nog nodig is, Veiligheid, Materialen en gereedschap, Stappenplan, Kwaliteitscontrole, Wat te verifiëren. Geef de voorkeur aan kwalitatieve compatibele producten, niet willekeurige topmerken. Vraag: "+question;
var parts=[{text:system}];if(pic)parts.push({inline_data:{mime_type:"image/jpeg",data:pic}});
try{var response=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":apiKey},body:JSON.stringify({contents:[{role:"user",parts:parts}],generationConfig:{temperature:0.25,maxOutputTokens:2700}})});
var data=await response.json();if(!response.ok)throw new Error((data.error&&data.error.message)||"API-fout "+response.status);
var answer=((data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[]).map(function(p){return p.text||""}).join("\n");if(!answer)throw new Error("Geen antwoord ontvangen");
latest={type:"ai",question:question,answer:answer};pic=null;go("result")
}catch(err){root.innerHTML='<section class="panel"><h2>AI tijdelijk niet beschikbaar</h2><p>'+esc(err.message)+'</p><p class="muted">Controleer API-sleutel, gratis quota en internetverbinding. De ingebouwde demo werkt zonder AI.</p><div class="row"><button class="btn" onclick="go(\'settings\')">Instellingen</button><button class="btn alt" onclick="openFloor()">Probeer demo</button></div></section>'}
}
go("home");
</script>
</body></html>
